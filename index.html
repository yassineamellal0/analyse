&lt;script&gt;
function extractNumbers(raw) {
  var matches = raw.match(/\d{6,}/g) || [];
  var seen = {}, unique = [], dupCount = 0;
  matches.forEach(function(n) {
    if (seen[n]) { dupCount++; return; }
    seen[n] = true;
    unique.push(n);
  });
  return { unique: unique, dupCount: dupCount };
}

function extractGeneric(raw) {
  var tokens = raw.split(/[\n,]+/)
    .map(function(t) { return t.trim().replace(/^[&#x27;&quot;]+|[&#x27;&quot;]+$/g, &#x27;&#x27;).trim(); })
    .filter(Boolean);
  var seen = {}, unique = [], dupCount = 0;
  tokens.forEach(function(t) {
    if (seen[t]) { dupCount++; return; }
    seen[t] = true;
    unique.push(t);
  });
  return { unique: unique, dupCount: dupCount };
}

function toIntl(n) {
  if (n.indexOf(&#x27;212&#x27;) === 0) return n;
  if (n.indexOf(&#x27;0&#x27;) === 0) return &#x27;212&#x27; + n.substring(1);
  return n;
}
function toNat(n) {
  if (n.indexOf(&#x27;212&#x27;) === 0) return &#x27;0&#x27; + n.substring(3);
  if (n.indexOf(&#x27;0&#x27;) === 0) return n;
  return n;
}

function run() {
  var btn = document.getElementById(&#x27;run-btn&#x27;);
  var icon = document.getElementById(&#x27;run-icon&#x27;);
  var label = document.getElementById(&#x27;run-label&#x27;);
  icon.classList.add(&#x27;spin&#x27;);
  label.textContent = &#x27;Traitement...&#x27;;
  btn.disabled = true;

  setTimeout(function() {
    try {
      var raw = document.getElementById(&#x27;input&#x27;).value;
      var res = extractNumbers(raw);
      var genRes = extractGeneric(raw);

      var ids = [&#x27;output-intl&#x27;, &#x27;output-nat&#x27;, &#x27;output-list-intl&#x27;, &#x27;output-list-nat&#x27;];
      if (res.unique.length === 0) {
        ids.forEach(function(id) { document.getElementById(id).value = &#x27;&#x27;; });
      } else {
        var intlList = res.unique.map(toIntl);
        var natList = res.unique.map(toNat);
        document.getElementById(&#x27;output-intl&#x27;).value = &#x27;(&#x27; + intlList.map(function(n){return &#x27;&quot;&#x27; + n + &#x27;&quot;&#x27;;}).join(&#x27; OR &#x27;) + &#x27;)&#x27;;
        document.getElementById(&#x27;output-nat&#x27;).value = &#x27;(&#x27; + natList.map(function(n){return &#x27;&quot;&#x27; + n + &#x27;&quot;&#x27;;}).join(&#x27; OR &#x27;) + &#x27;)&#x27;;
        document.getElementById(&#x27;output-list-intl&#x27;).value = intlList.map(function(n){return &quot;&#x27;&quot; + n + &quot;&#x27;&quot;;}).join(&#x27;,\n&#x27;);
        document.getElementById(&#x27;output-list-nat&#x27;).value = natList.map(function(n){return &quot;&#x27;&quot; + n + &quot;&#x27;&quot;;}).join(&#x27;,\n&#x27;);
      }

      document.getElementById(&#x27;output-generic&#x27;).value = genRes.unique.map(function(v){ return &quot;&#x27;&quot; + v + &quot;&#x27;&quot;; }).join(&#x27;,\n&#x27;);

      var msg = res.unique.length + &#x27; numéro(s) unique(s) détecté(s)&#x27;;
      if (res.dupCount &gt; 0) msg += &#x27; (&#x27; + res.dupCount + &#x27; doublon(s) numériques supprimé(s))&#x27;;
      msg += &#x27; — &#x27; + genRes.unique.length + &#x27; valeur(s) au format libre&#x27;;
      if (genRes.dupCount &gt; 0) msg += &#x27; (&#x27; + genRes.dupCount + &#x27; doublon(s) supprimé(s))&#x27;;
      document.getElementById(&#x27;status-line&#x27;).textContent = msg;
    } catch (e) {
      document.getElementById(&#x27;status-line&#x27;).textContent = &#x27;Erreur de traitement.&#x27;;
    }
    icon.classList.remove(&#x27;spin&#x27;);
    label.textContent = &#x27;Lancer&#x27;;
    btn.disabled = false;
  }, 200);
}

document.getElementById(&#x27;run-btn&#x27;).addEventListener(&#x27;click&#x27;, run);
document.getElementById(&#x27;input&#x27;).addEventListener(&#x27;keydown&#x27;, function(e) {
  if ((e.metaKey || e.ctrlKey) &amp;&amp; e.key === &#x27;Enter&#x27;) run();
});
document.getElementById(&#x27;clear-btn&#x27;).addEventListener(&#x27;click&#x27;, function() {
  document.getElementById(&#x27;input&#x27;).value = &#x27;&#x27;;
  [&#x27;output-intl&#x27;,&#x27;output-nat&#x27;,&#x27;output-list-intl&#x27;,&#x27;output-list-nat&#x27;,&#x27;output-generic&#x27;].forEach(function(id) {
    document.getElementById(id).value = &#x27;&#x27;;
  });
  document.getElementById(&#x27;status-line&#x27;).textContent = &#x27;&#x27;;
});
document.querySelectorAll(&#x27;.copy-btn&#x27;).forEach(function(btn) {
  btn.addEventListener(&#x27;click&#x27;, function() {
    var text = document.getElementById(btn.getAttribute(&#x27;data-target&#x27;)).value;
    if (!text) return;
    try {
      navigator.clipboard.writeText(text).then(function() {
        document.getElementById(&#x27;status-line&#x27;).textContent = &#x27;Copié dans le presse-papiers&#x27;;
      });
    } catch (e) {
      document.getElementById(&#x27;status-line&#x27;).textContent = &#x27;Impossible de copier automatiquement — sélectionne le texte manuellement.&#x27;;
    }
  });
});
&lt;/script&gt;
&lt;/body&gt;

&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
  :root {
    --ink: #1B2A41;
    --ink-soft: #3D4A5C;
    --paper: #FFFFFF;
    --paper-dim: #F6F7F9;
    --line: #DFE3E9;
    --red: #B23A2E;
    --red-bg: #FBEAE8;
    --table-bg: #FFFFFF;
    --row-odd: #FFFFFF;
    --row-even: #F5F7FA;
    --row-unpaid: #FDF1EF;
    --tbl-head: #0E4B45;
    --tbl-head-fg: #E7F4F1;
    --tbl-row: #FFFFFF;
    --tbl-row-alt: #F1F8F6;
    --tbl-shadow: rgba(14,75,69,0.08);
    --tbl-accent-unpaid: #B23A2E;
    --tbl-accent-paid: #1F7A5C;
    --tbl-pill-unpaid-bg: #FBEAE8;
    --tbl-pill-unpaid-fg: #B23A2E;
    --tbl-pill-paid-bg: #E4F2EC;
    --tbl-pill-paid-fg: #1F7A5C;
    --tbl-total-bg: #0E4B45;
    --tbl-total-fg: #E7F4F1;
    --tbl-total-accent: #D8B24A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--paper-dim);
    color: var(--ink);
    font-family: &#x27;Inter&#x27;, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  header.bill-header {
    background: var(--ink);
    color: #EDEFF3;
    border-radius: 2px;
    padding: 40px 40px 32px;
    position: relative;
    overflow: hidden;
  }
  header.bill-header::after {
    content: &quot;&quot;;
    position: absolute;
    right: -60px;
    top: -60px;
    width: 220px;
    height: 220px;
    border: 1px solid rgba(237,239,243,0.12);
    border-radius: 50%;
  }
  header.bill-header::before {
    content: &quot;&quot;;
    position: absolute;
    right: -20px;
    top: -20px;
    width: 140px;
    height: 140px;
    border: 1px solid rgba(237,239,243,0.16);
    border-radius: 50%;
  }

  .eyebrow-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: #A7B1C2;
    margin-bottom: 22px;
  }

  h1.client-name {
    font-family: &#x27;Source Serif 4&#x27;, serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 26px;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .header-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    border-top: 1px solid rgba(237,239,243,0.18);
    padding-top: 22px;
  }
  .stat-label {
    font-size: 0.72rem;
    color: #9CA7BA;
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: &#x27;Source Serif 4&#x27;, serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: #F4F5F7;
  }
  .stat-value.alert {
    color: #E8877A;
  }
  .stat-sub {
    font-size: 0.78rem;
    color: #A7B1C2;
    margin-top: 2px;
  }

  .banner {
    margin-top: 28px;
    background: var(--paper);
    border-left: 3px solid var(--red);
    border-radius: 2px;
    padding: 16px 22px;
    font-size: 0.92rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .banner strong { color: var(--red); }

  .input-panel {
    margin-bottom: 40px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 22px 24px;
  }
  .input-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .input-panel-head h2 {
    font-family: &#x27;Source Serif 4&#x27;, serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .input-panel-head span {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  textarea#logInput {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    background: var(--paper-dim);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 16px;
    color: var(--ink);
    font-family: &#x27;SFMono-Regular&#x27;, ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    line-height: 1.5;
  }
  textarea#logInput:focus {
    outline: none;
    border-color: var(--ink);
  }
  .input-panel-actions {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font-family: &#x27;Inter&#x27;, sans-serif;
    font-size: 0.84rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.86; }
  .btn-run {
    background: var(--ink);
    color: #F4F5F7;
  }
  .btn-clear {
    background: transparent;
    color: var(--red);
    border-color: var(--red);
  }
  .input-error {
    font-size: 0.8rem;
    color: var(--red);
    margin-top: 4px;
  }

  .table-section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 36px 2px 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .table-section-title h2 {
    font-family: &#x27;Source Serif 4&#x27;, serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .table-section-title span {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .table-wrap {
    overflow-x: auto;
    padding-bottom: 4px;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 10px;
    font-size: 0.86rem;
    min-width: 700px;
  }

  thead th {
    text-align: left;
    font-weight: 700;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--tbl-head-fg);
    padding: 15px 18px;
    background: var(--tbl-head);
    white-space: nowrap;
  }
  thead th.num { text-align: right; }
  thead th:first-child { border-radius: 6px 0 0 6px; }
  thead th:last-child { border-radius: 0 6px 6px 0; text-align: right; }

  tbody tr { box-shadow: 0 1px 3px var(--tbl-shadow); }
  tbody tr.is-paid td { background: var(--tbl-row); }
  tbody tr.is-unpaid td { background: var(--tbl-row); }
  tbody tr:nth-child(even).is-paid td { background: var(--tbl-row-alt); }

  tbody td {
    padding: 16px 18px;
    vertical-align: top;
    color: var(--ink);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  tbody td:first-child {
    border-left: 4px solid var(--tbl-accent-paid);
    border-top-left-radius: 6px;
    border-bottom-left-radius: 6px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  tbody tr.is-unpaid td:first-child { border-left-color: var(--tbl-accent-unpaid); }
  tbody td:last-child {
    border-top-right-radius: 6px;
    border-bottom-right-radius: 6px;
    border-right: 1px solid var(--line);
  }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.bill-no { font-family: &#x27;Source Serif 4&#x27;, serif; font-weight: 600; }
  tbody td .due { color: var(--ink-soft); }
  tbody td.status-cell { text-align: right; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.74rem;
    font-weight: 600;
    padding: 5px 12px 5px 10px;
    border-radius: 20px;
    background: var(--tbl-pill-unpaid-bg);
    color: var(--tbl-pill-unpaid-fg);
    white-space: nowrap;
  }
  .status-pill::before {
    content: &quot;&quot;;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .status-pill.paid {
    background: var(--tbl-pill-paid-bg);
    color: var(--tbl-pill-paid-fg);
  }

  .amount-due {
    font-weight: 700;
  }

  tfoot td {
    padding: 16px 18px;
    font-weight: 700;
    background: var(--tbl-total-bg);
    color: var(--tbl-total-fg);
    border: none;
  }
  tfoot td:first-child { border-radius: 6px 0 0 6px; }
  tfoot td:last-child { border-radius: 0 6px 6px 0; }
  tfoot td.num { text-align: right; color: var(--tbl-total-accent); font-size: 1rem; }

  footer.notes {
    margin-top: 22px;
    font-size: 0.78rem;
    color: #808A9B;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .sheet { padding: 28px 16px 48px; }
    header.bill-header { padding: 28px 22px 24px; }
    h1.client-name { font-size: 1.6rem; }
    .header-stats { grid-template-columns: 1fr; gap: 16px; }
    .banner { padding: 14px 16px; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=&quot;light&quot;]) {
      --paper: #14181F;
      --paper-dim: #0D1015;
      --ink: #E7EAEF;
      --ink-soft: #9AA4B4;
      --line: #2A3140;
      --red: #E8877A;
      --red-bg: rgba(178,58,46,0.18);
      --table-bg: #14181F;
      --row-odd: #14181F;
      --row-even: #191E27;
      --row-unpaid: rgba(178,58,46,0.14);
      --tbl-head: #0A2E2B;
      --tbl-row: #181D26;
      --tbl-row-alt: #1D242E;
      --tbl-shadow: rgba(0,0,0,0.25);
      --tbl-pill-unpaid-bg: rgba(178,58,46,0.2);
      --tbl-pill-paid-bg: rgba(31,122,92,0.2);
      --tbl-pill-paid-fg: #5FBE95;
      --tbl-total-bg: #0A2E2B;
    }
    body { background: var(--paper-dim); }
    header.bill-header { background: #0D1015; }
  }
  :root[data-theme=&quot;dark&quot;] {
    --paper: #14181F;
    --paper-dim: #0D1015;
    --ink: #E7EAEF;
    --ink-soft: #9AA4B4;
    --line: #2A3140;
    --red: #E8877A;
    --red-bg: rgba(178,58,46,0.18);
    --table-bg: #14181F;
    --row-odd: #14181F;
    --row-even: #191E27;
    --row-unpaid: rgba(178,58,46,0.14);
    --tbl-head: #0A2E2B;
    --tbl-row: #181D26;
    --tbl-row-alt: #1D242E;
    --tbl-shadow: rgba(0,0,0,0.25);
    --tbl-pill-unpaid-bg: rgba(178,58,46,0.2);
    --tbl-pill-paid-bg: rgba(31,122,92,0.2);
    --tbl-pill-paid-fg: #5FBE95;
    --tbl-total-bg: #0A2E2B;
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;sheet&quot;&gt;

    &lt;section class=&quot;input-panel&quot;&gt;
      &lt;div class=&quot;input-panel-head&quot;&gt;
        &lt;h2&gt;Coller le log JSON&lt;/h2&gt;
        &lt;span&gt;Format API brut (tableau de factures)&lt;/span&gt;
      &lt;/div&gt;
      &lt;textarea id=&quot;logInput&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;
      &lt;div id=&quot;inputError&quot; class=&quot;input-error&quot; style=&quot;display:none;&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;input-panel-actions&quot;&gt;
        &lt;button class=&quot;btn btn-run&quot; id=&quot;btnRun&quot;&gt;Lancer&lt;/button&gt;
        &lt;button class=&quot;btn btn-clear&quot; id=&quot;btnClear&quot;&gt;Effacer&lt;/button&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;header class=&quot;bill-header&quot;&gt;
      &lt;div class=&quot;eyebrow-row&quot;&gt;
        &lt;span&gt;Relevé de facturation&lt;/span&gt;
        &lt;span id=&quot;accountEyebrow&quot;&gt;Compte n° —&lt;/span&gt;
      &lt;/div&gt;
      &lt;h1 class=&quot;client-name&quot; id=&quot;clientName&quot;&gt;—&lt;/h1&gt;
      &lt;div class=&quot;header-stats&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Compte de facturation&lt;/div&gt;
          &lt;div class=&quot;stat-value&quot; id=&quot;accountId&quot;&gt;—&lt;/div&gt;
          &lt;div class=&quot;stat-sub&quot; id=&quot;accountSub&quot;&gt;—&lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Factures impayées&lt;/div&gt;
          &lt;div class=&quot;stat-value alert&quot; id=&quot;unpaidCount&quot;&gt;—&lt;/div&gt;
          &lt;div class=&quot;stat-sub&quot;&gt;sur &lt;span id=&quot;totalCount&quot;&gt;—&lt;/span&gt; facture(s) au total&lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Montant total dû&lt;/div&gt;
          &lt;div class=&quot;stat-value alert&quot; id=&quot;totalDue&quot;&gt;—&lt;/div&gt;
          &lt;div class=&quot;stat-sub&quot;&gt;toutes factures impayées&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;banner&quot;&gt;
      &lt;span&gt;&lt;strong id=&quot;bannerCount&quot;&gt;—&lt;/strong&gt; facture(s) en statut &lt;strong&gt;impayée&lt;/strong&gt; nécessitent un règlement.&lt;/span&gt;
      &lt;span id=&quot;bannerAmount&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;table-section-title&quot;&gt;
      &lt;h2&gt;Détail des factures&lt;/h2&gt;
      &lt;span&gt;Triées de la plus récente à la plus ancienne&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;N° Facture&lt;/th&gt;
            &lt;th&gt;Période&lt;/th&gt;
            &lt;th&gt;Échéance&lt;/th&gt;
            &lt;th class=&quot;num&quot;&gt;Montant HT&lt;/th&gt;
            &lt;th class=&quot;num&quot;&gt;Montant TTC&lt;/th&gt;
            &lt;th class=&quot;num&quot;&gt;Restant dû&lt;/th&gt;
            &lt;th&gt;Statut&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody id=&quot;billsBody&quot;&gt;&lt;/tbody&gt;
        &lt;tfoot&gt;
          &lt;tr&gt;
            &lt;td colspan=&quot;5&quot;&gt;Total dû&lt;/td&gt;
            &lt;td class=&quot;num&quot; id=&quot;footerTotal&quot;&gt;—&lt;/td&gt;
            &lt;td&gt;&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tfoot&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;footer class=&quot;notes&quot;&gt;
      Statut « 0 » interprété comme facture émise et non soldée (« impayée »), le montant restant dû étant égal au montant total de la facture pour chaque ligne. Montants exprimés dans la devise du compte, TVA (≈20%) incluse dans le montant TTC.
    &lt;/footer&gt;

  &lt;/div&gt;

&lt;script&gt;

  const els = {
    input: document.getElementById(&#x27;logInput&#x27;),
    error: document.getElementById(&#x27;inputError&#x27;),
    body: document.getElementById(&#x27;billsBody&#x27;),
    footerTotal: document.getElementById(&#x27;footerTotal&#x27;),
    unpaidCount: document.getElementById(&#x27;unpaidCount&#x27;),
    totalCount: document.getElementById(&#x27;totalCount&#x27;),
    totalDue: document.getElementById(&#x27;totalDue&#x27;),
    bannerCount: document.getElementById(&#x27;bannerCount&#x27;),
    bannerAmount: document.getElementById(&#x27;bannerAmount&#x27;),
    clientName: document.getElementById(&#x27;clientName&#x27;),
    accountId: document.getElementById(&#x27;accountId&#x27;),
    accountEyebrow: document.getElementById(&#x27;accountEyebrow&#x27;),
    accountSub: document.getElementById(&#x27;accountSub&#x27;)
  };

  function stripZone(iso) {
    return String(iso).replace(/\[.*\]$/, &#x27;&#x27;);
  }
  function fmtDate(iso) {
    if (!iso) return &#x27;—&#x27;;
    const dt = new Date(stripZone(iso));
    if (isNaN(dt.getTime())) return &#x27;—&#x27;;
    return dt.toLocaleDateString(&#x27;fr-FR&#x27;, { day: &#x27;2-digit&#x27;, month: &#x27;2-digit&#x27;, year: &#x27;numeric&#x27;, timeZone: &#x27;UTC&#x27; });
  }
  function fmtAmount(v) {
    const n = Number(v) || 0;
    return n.toLocaleString(&#x27;fr-FR&#x27;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function resetDisplay() {
    els.body.innerHTML = &#x27;&#x27;;
    els.footerTotal.textContent = &#x27;—&#x27;;
    els.unpaidCount.textContent = &#x27;—&#x27;;
    els.totalCount.textContent = &#x27;—&#x27;;
    els.totalDue.textContent = &#x27;—&#x27;;
    els.bannerCount.textContent = &#x27;—&#x27;;
    els.bannerAmount.textContent = &#x27;&#x27;;
    els.clientName.textContent = &#x27;—&#x27;;
    els.accountId.textContent = &#x27;—&#x27;;
    els.accountEyebrow.textContent = &#x27;Compte n° —&#x27;;
    els.accountSub.textContent = &#x27;—&#x27;;
    els.error.style.display = &#x27;none&#x27;;
  }

  function render(rawBills) {
    els.error.style.display = &#x27;none&#x27;;
    els.body.innerHTML = &#x27;&#x27;;

    if (!Array.isArray(rawBills) || rawBills.length === 0) {
      els.error.textContent = &#x27;Le log ne contient aucune facture exploitable.&#x27;;
      els.error.style.display = &#x27;block&#x27;;
      return;
    }

    const first = rawBills[0];
    els.clientName.textContent = first.name || &#x27;—&#x27;;
    els.accountId.textContent = first.billingAccount?.id || &#x27;—&#x27;;
    els.accountEyebrow.textContent = &#x27;Compte n° &#x27; + (first.billingAccount?.id || &#x27;—&#x27;);
    els.accountSub.textContent = &#x27;Type &#x27; + (first.billingAccount?.type || &#x27;—&#x27;) + &#x27; · PIN &#x27; + (first.pin || &#x27;—&#x27;);

    let unpaid = 0, totalDue = 0;

    rawBills.forEach(b =&gt; {
      const isUnpaid = String(b.status) === &quot;0&quot;;
      const remaining = b.remainingAmount?.value ?? 0;
      if (isUnpaid) { unpaid++; totalDue += Number(remaining) || 0; }

      const tr = document.createElement(&#x27;tr&#x27;);
      tr.classList.add(isUnpaid ? &#x27;is-unpaid&#x27; : &#x27;is-paid&#x27;);
      tr.innerHTML = `
        &lt;td class=&quot;bill-no&quot;&gt;${b.billNo || &#x27;—&#x27;}&lt;/td&gt;
        &lt;td&gt;${fmtDate(b.billingPeriod?.startDateTime)} → ${fmtDate(b.billingPeriod?.endDateTime)}&lt;/td&gt;
        &lt;td class=&quot;due&quot;&gt;${fmtDate(b.paymentDueDate)}&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;${fmtAmount(b.taxExcludedAmount?.value)}&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;${fmtAmount(b.taxIncludedAmount?.value)}&lt;/td&gt;
        &lt;td class=&quot;num amount-due&quot;&gt;${fmtAmount(remaining)}&lt;/td&gt;
        &lt;td class=&quot;status-cell&quot;&gt;${isUnpaid ? &#x27;&lt;span class=&quot;status-pill&quot;&gt;Impayée&lt;/span&gt;&#x27; : &#x27;&lt;span class=&quot;status-pill paid&quot;&gt;Soldée&lt;/span&gt;&#x27;}&lt;/td&gt;
      `;
      els.body.appendChild(tr);
    });

    els.unpaidCount.textContent = unpaid;
    els.totalCount.textContent = rawBills.length;
    els.totalDue.textContent = fmtAmount(totalDue);
    els.bannerCount.textContent = unpaid;
    els.bannerAmount.textContent = &#x27;Total : &#x27; + fmtAmount(totalDue) + &#x27; MAD&#x27;;
    els.footerTotal.textContent = fmtAmount(totalDue);
  }

  function normalizeLog(raw) {
    let s = raw.trim();

    // Cas fréquent : le log est collé entouré de guillemets englobants
    // (ex: &quot;[{&quot;a&quot;:1}]&quot;) — ce n&#x27;est pas du JSON valide tel quel, on retire
    // ce premier/dernier guillemet si le contenu interne ressemble à un tableau/objet.
    const wrappers = [&#x27;&quot;&#x27;, &quot;&#x27;&quot;, &#x27;\u201C\u201D&#x27;, &#x27;\u2018\u2019&#x27;];
    if (s.length &gt; 1) {
      const first = s[0], last = s[s.length - 1];
      const isQuoteWrap =
        (first === &#x27;&quot;&#x27; &amp;&amp; last === &#x27;&quot;&#x27;) ||
        (first === &quot;&#x27;&quot; &amp;&amp; last === &quot;&#x27;&quot;) ||
        (first === &#x27;\u201C&#x27; &amp;&amp; last === &#x27;\u201D&#x27;) ||
        (first === &#x27;\u2018&#x27; &amp;&amp; last === &#x27;\u2019&#x27;);
      if (isQuoteWrap) {
        const inner = s.slice(1, -1).trim();
        if (inner.startsWith(&#x27;[&#x27;) || inner.startsWith(&#x27;{&#x27;)) {
          s = inner;
        }
      }
    }

    // Supprime une éventuelle virgule finale avant ] ou }
    s = s.replace(/,\s*([\]}])/g, &#x27;$1&#x27;);

    return s;
  }

  function runFromInput() {
    const original = els.input.value.trim();
    if (!original) {
      els.error.textContent = &#x27;Collez un log JSON avant de lancer.&#x27;;
      els.error.style.display = &#x27;block&#x27;;
      return;
    }

    const attempts = [original, normalizeLog(original)];
    let parsed = null, lastErr = null;

    for (const candidate of attempts) {
      try {
        parsed = JSON.parse(candidate);
        lastErr = null;
        break;
      } catch (e) {
        lastErr = e;
      }
    }

    if (lastErr) {
      els.error.textContent = &#x27;JSON invalide : &#x27; + lastErr.message;
      els.error.style.display = &#x27;block&#x27;;
      return;
    }

    render(parsed);
  }

  document.getElementById(&#x27;btnRun&#x27;).addEventListener(&#x27;click&#x27;, runFromInput);
  document.getElementById(&#x27;btnClear&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    els.input.value = &#x27;&#x27;;
    resetDisplay();
  });

  // Zone de saisie vide au chargement — aucune donnée pré-remplie
  els.input.value = &#x27;&#x27;;
&lt;/script&gt;

&lt;script&gt;
const ID_MAP = {
  &#x27;2207&#x27;:{ label:&#x27;Statut abonnement&#x27; },
  &#x27;2000&#x27;:{ label:&#x27;Solde Recharge&#x27; },
  &#x27;2247&#x27;:{ label:&#x27;Recharge *9&#x27; },
  &#x27;2893&#x27;:{ label:&#x27;Elix Fun Voice 1j&#x27; },
  &#x27;3000&#x27;:{ label:&#x27;Solde voix mensuel&#x27; },
  &#x27;2261&#x27;:{ label:&#x27;Balance forfait 30j&#x27; },
  &#x27;2276&#x27;:{ label:&#x27;Balance ONNET&#x27; },
  &#x27;2685&#x27;:{ label:&#x27;Gratuité ONNET&#x27; },
  &#x27;5060&#x27;:{ label:&#x27;Internet sur mobile&#x27; },
  &#x27;5210&#x27;:{ label:&#x27;WhatsApp illimité&#x27; },
};

function fmt(dt){
  if(!dt) return &#x27;—&#x27;;
  try{
    const d=new Date(dt.replace(&#x27;[UTC]&#x27;,&#x27;&#x27;));
    const dd=String(d.getDate()).padStart(2,&#x27;0&#x27;);
    const mm=String(d.getMonth()+1).padStart(2,&#x27;0&#x27;);
    const yy=d.getFullYear();
    const hh=String(d.getHours()).padStart(2,&#x27;0&#x27;);
    const mn=String(d.getMinutes()).padStart(2,&#x27;0&#x27;);
    return `${dd}/${mm}/${yy} ${hh}:${mn}`;
  }catch{return dt.slice(0,10);}
}
function daysLeft(dt){
  if(!dt) return 9999;
  return (new Date(dt.replace(&#x27;[UTC]&#x27;,&#x27;&#x27;))-new Date())/(86400000);
}
function getStatus(item){
  const rv=parseFloat(item.realValue), dl=daysLeft(item.validFor?.endDateTime);
  if(dl&lt;0) return &#x27;err&#x27;;
  if(dl&lt;=7) return &#x27;warn&#x27;;
  if(item.id===&#x27;2207&#x27;) return rv===1?&#x27;ok&#x27;:&#x27;err&#x27;;
  if(rv===0&amp;&amp;item.unit===&#x27;DH(s)&#x27;) return &#x27;err&#x27;;
  return &#x27;ok&#x27;;
}
function fmtBal(item){
  const rv=parseFloat(item.realValue), v=item.value;
  if(item.id===&#x27;2207&#x27;) return rv===1?&#x27;Actif&#x27;:&#x27;Inactif&#x27;;
  if(item.unit===&#x27;MO&#x27;){
    if(rv&gt;=1e9) return (rv/1e9).toFixed(2)+&#x27; Go&#x27;;
    if(rv&gt;=1e6) return (rv/1e6).toFixed(2)+&#x27; Mo&#x27;;
    return parseFloat(v||rv).toFixed(2);
  }
  return v||String(rv);
}
function unitTag(u){
  if(!u||u===&#x27;&#x27;) return &#x27;&lt;span class=&quot;u-none&quot;&gt;—&lt;/span&gt;&#x27;;
  const c=u===&#x27;DH(s)&#x27;?&#x27;u-dh&#x27;:u===&#x27;MO&#x27;?&#x27;u-mo&#x27;:u===&#x27;UNIT&#x27;?&#x27;u-unit&#x27;:&#x27;u-none&#x27;;
  return `&lt;span class=&quot;unit-tag ${c}&quot;&gt;${u}&lt;/span&gt;`;
}
function dtCls(dt){
  const dl=daysLeft(dt);
  return dl&lt;0?&#x27;dt expired&#x27;:dl&lt;=7?&#x27;dt near&#x27;:&#x27;dt&#x27;;
}

function analyser(){
  const raw=document.getElementById(&#x27;logInput&#x27;).value.trim();
  const eb=document.getElementById(&#x27;errBox&#x27;), res=document.getElementById(&#x27;results&#x27;);
  eb.className=&#x27;err-box&#x27;; res.className=&#x27;results&#x27;;
  if(!raw){eb.textContent=&#x27;Veuillez coller un log JSON.&#x27;;eb.className=&#x27;err-box show&#x27;;return;}
  let data;
  try{
    const m=raw.match(/\[[\s\S]*\]/);
    if(!m) throw new Error(&#x27;Aucun tableau JSON trouvé&#x27;);
    data=JSON.parse(m[0]);
  }catch(e){eb.textContent=&#x27;JSON invalide : &#x27;+e.message;eb.className=&#x27;err-box show&#x27;;return;}

  let ok=0,warn=0,err=0;
  let rows=&#x27;&#x27;;

  data.forEach((item,i)=&gt;{
    const meta=ID_MAP[item.id]||{label:item.name||item.id};
    const st=getStatus(item);
    if(st===&#x27;ok&#x27;)ok++;else if(st===&#x27;warn&#x27;)warn++;else err++;
    const bal=fmtBal(item);
    const dl=daysLeft(item.validFor?.endDateTime);
    const rv=parseFloat(item.realValue);



    const stLabel=st===&#x27;ok&#x27;?&#x27;Actif&#x27;:st===&#x27;warn&#x27;?&#x27;Bientôt exp.&#x27;:&#x27;Épuisé / Expiré&#x27;;
    rows+=`
      &lt;tr&gt;
        &lt;td&gt;&lt;span class=&quot;id-pill&quot;&gt;${item.id}&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;&lt;div class=&quot;lib-name&quot;&gt;${meta.label}&lt;/div&gt;${item.name!==meta.label?`&lt;div class=&quot;lib-raw&quot;&gt;${item.name}&lt;/div&gt;`:&#x27;&#x27;}&lt;/td&gt;
        &lt;td&gt;&lt;span class=&quot;bal-val&quot;&gt;${bal}&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;${unitTag(item.unit)}&lt;/td&gt;
        &lt;td class=&quot;dt&quot;&gt;${fmt(item.validFor?.startDateTime)}&lt;/td&gt;
        &lt;td class=&quot;${dtCls(item.validFor?.endDateTime)}&quot;&gt;${fmt(item.validFor?.endDateTime)}&lt;/td&gt;
        &lt;td&gt;&lt;span class=&quot;st ${st}&quot;&gt;${stLabel}&lt;/span&gt;&lt;/td&gt;
      &lt;/tr&gt;`;
  });

  document.getElementById(&#x27;tbody&#x27;).innerHTML=rows;
  document.getElementById(&#x27;countBadge&#x27;).textContent=data.length+&#x27; balance&#x27;+(data.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;);

  document.getElementById(&#x27;chips&#x27;).innerHTML=`
    &lt;div class=&quot;chip info&quot;&gt;&lt;div&gt;&lt;div class=&quot;chip-num&quot;&gt;${data.length}&lt;/div&gt;&lt;div class=&quot;chip-lbl&quot;&gt;Total balances&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;chip warn&quot;&gt;&lt;div&gt;&lt;div class=&quot;chip-num&quot;&gt;${warn}&lt;/div&gt;&lt;div class=&quot;chip-lbl&quot;&gt;Bientôt expirées&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

  `;

  res.className=&#x27;results show&#x27;;
}

<script>
  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tool = btn.getAttribute('data-tool');
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tool-frame').forEach(function(f) { f.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('frame-' + tool).classList.add('active');

  });
  document.querySelector('.tool-frame').classList.add('active');
